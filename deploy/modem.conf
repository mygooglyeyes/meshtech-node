# cleanmodem modem.conf - hilltop template (meshtech-node runbook 3.1)
# Radio settings below are PLACEHOLDERS pending the line-by-line check
# against /etc/openhop_repeater/config.yaml's radio block (runbook rule:
# never assume defaults are current - VERIFY, then remove this line).

# ── server ──────────────────────────────────────────────────────────
host = 127.0.0.1
port = 5055
# Token files (mode 600, created by Brett in runbook 1.4 / 3.1):
token_file = /opt/meshtech-node/modem.token
controller_file = /opt/meshtech-node/modem.token

# ── radio ───────────────────────────────────────────────────────────
# VERIFY THESE against the old repeater config before first start:
frequency_hz = 910525000
spreading_factor = 7
coding_rate = 5
bandwidth_hz = 62500
sync_word = 0x12
preamble_length = 32
tx_power_dbm = 20

# ── radio hardware ──────────────────────────────────────────────────
# PiMesh 1W v2: the proven pin map (CE0 CS, DIO2 RF switch, DIO3 TCXO
# 1.8 V, pin 26 power-enable). This is the board hilltop runs.
pin_profile = pimesh-1w-v2
