# cleanmodem modem.conf - hilltop (embedded radio server)
# Managed by manage.sh: the token files below are created by
# `manage.sh setup` under secrets/ (mode 600). Radio settings are
# PLACEHOLDERS pending the line-by-line check against the old
# repeater's radio block (VERIFY, never assume defaults).

host = 127.0.0.1
port = 5055
token_file = /opt/meshtech-node/secrets/modem.token
controller_file = /opt/meshtech-node/secrets/modem.token

# VERIFY THESE against the old repeater config before first start:
frequency_hz = 910525000
spreading_factor = 7
coding_rate = 5
bandwidth_hz = 62500
sync_word = 0x12
preamble_length = 32
tx_power_dbm = 20

# PiMesh 1W v2: the proven pin map (CE0 CS, DIO2 RF switch, DIO3
# TCXO 1.8 V, pin 26 power-enable).
pin_profile = pimesh-1w-v2
